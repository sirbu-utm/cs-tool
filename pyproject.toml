[project]
name = "cyberfw"
version = "1.0.0"
description = "Integrated Cybersecurity Framework in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "anyio>=4.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
cyberfw = "cyberfw.cli:app"
cs-tool = "cyberfw.cli:app"
cstool = "cyberfw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cyberfw"]

# The registry and the shipped pipelines live at the repo root for the
# workspace layout; the wheel carries the same files as package data so an
# installed `cyberfw` works from any directory (see cyberfw/resources.py).
[tool.hatch.build.targets.wheel.force-include]
"registry.yaml" = "cyberfw/data/registry.yaml"
"pipelines" = "cyberfw/data/pipelines"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `integration` tests drive the REAL precompiled binaries (and some need
# network); they are opt-in and excluded from the default run / CI gate.
# Run them explicitly with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: exercises real tools_bin/ binaries and/or network; opt-in",
]
