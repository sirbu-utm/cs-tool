name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint-type-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux; the other two platforms on one
        # interpreter each, because the OS-specific code (Git Bash lookup and
        # PE checks on Windows, exec bits and signals on POSIX) is what they
        # need to exercise, not the Python version.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # `python -m` rather than the console-script shims: the shims go through
      # uv's trampoline, which has tripped over MSYS-style paths on Windows.
      - name: Lint (ruff)
        run: uv run python -m ruff check .

      - name: Type check (mypy --strict)
        run: uv run python -m mypy cyberfw

      # Deliberately the runner's own default shell (pwsh on Windows): what
      # bash the executor finds depends on PATH order, and running everything
      # from Git Bash hid a Windows-only failure for seven runs.
      - name: Test (pytest + coverage)
        run: >
          uv run python -m pytest tests/ --cov=cyberfw --cov-report=term-missing
          --cov-fail-under=80 -rf --tb=short --junitxml=pytest-report.xml

      # Actions logs need an authenticated request to read, annotations do not:
      # a red run names the failing tests on the commit itself.
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path("pytest-report.xml")
          if not report.is_file():
              raise SystemExit(0)
          for case in ET.parse(report).getroot().iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  where = f"{case.get('classname', '')}::{case.get('name', '')}"
                  detail = " ".join((problem.get("message") or "").split())[:400]
                  print(f"::error::{where} — {detail}")
          PY
