name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint-type-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux; the other two platforms on one
        # interpreter each, because the OS-specific code (Git Bash lookup and
        # PE checks on Windows, exec bits and signals on POSIX) is what they
        # need to exercise, not the Python version.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # `python -m` rather than the console-script shims: the shims go through
      # uv's trampoline, which has tripped over MSYS-style paths on Windows.
      - name: Lint (ruff)
        run: uv run python -m ruff check .

      - name: Type check (mypy --strict)
        run: uv run python -m mypy cyberfw

      # bash on all three runners (Git Bash on Windows), so one script serves
      # them. Failures are echoed back as ::error:: annotations: a red run then
      # names the tests on the commit itself, instead of only inside the log.
      - name: Test (pytest + coverage)
        shell: bash
        run: |
          set -o pipefail
          if ! uv run python -m pytest tests/ --cov=cyberfw --cov-report=term-missing \
               --cov-fail-under=80 -rf --tb=short | tee pytest-output.txt; then
            grep -E '^(FAILED|ERROR)' pytest-output.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
