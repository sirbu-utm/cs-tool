name: Publish to PyPI

# A GitHub release publishes the version its tag names (v1.0.0 -> 1.0.0), through
# PyPI's trusted publishing: PyPI trusts this workflow file in the `pypi`
# environment, so no API token is stored anywhere.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # A release tag that disagrees with pyproject.toml would publish a version
      # nobody tagged — and a version on PyPI can never be uploaded again.
      - name: Check the tag names the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not name pyproject.toml's version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cyberfw
    permissions:
      id-token: write  # what trusted publishing signs in with; nothing else is granted
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
